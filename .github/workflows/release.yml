name: Release DMG on main

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version, commit and tag
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh

      - name: Make binaries script executable
        run: chmod +x scripts/download_binaries.sh

      - name: Download embedded binaries (adb, scrcpy)
        run: ./scripts/download_binaries.sh

      - name: Build DMG
        run: ./gradlew --no-daemon packageDmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidUtils-dmg-${{ steps.bump.outputs.version }}
          path: build/compose/binaries/main/dmg/*.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: Release v${{ steps.bump.outputs.version }}
          body: |
            ## Changes
            
            ${{ steps.bump.outputs.bump_type }} version bump
            
            See commit history for details.
          files: build/compose/binaries/main/dmg/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



